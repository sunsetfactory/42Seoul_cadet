services:
  mariadb:
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/mysql  # Named Volume 사용
    networks:
      - seokyangNet
    expose:
      - "3306"

  wordpress:
    image: wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - wp_volume:/var/www/html  # Named Volume 사용
    depends_on:
      - mariadb
    networks:
      - seokyangNet
    expose:
      - "9000"

  nginx:
    image: nginx
    container_name: nginx
    restart: always
  #  Nginx 설정 파일
    volumes:
      - wp_volume:/var/www/html:do  # Read-Only로 마운트
    depends_on:
      - wordpress
    networks:
      - seokyangNet
    ports:
      - "443:443"

volumes:
  wp_volume:
    name: wp_volume
    driver: local
    driver_opts:
      type: none
      device: /Users/seokjyan/data/wordpress
      o: bind
  db_volume:
    name: db_volume
    driver: local
    driver_opts:
      type: none
      device: /Users/seokjyan/data/mariadb
      o: bind

networks:
  seokyangNet:
    driver: bridge

# https://docs.docker.com/reference/dockerfile/
# Users = home