version: '3.8'

services:
  mariadb:
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - ./mariadb/data:/var/lib/mysql
    networks:
      - my_network
    expose:
      - "3306"  # 외부에서 접근할 수 없는 컨테이너 내부 노출

  wordpress:
    image: wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - ./wordpress/data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - my_network
    expose:
      - "9000"  # 외부에서 접근할 수 없는 컨테이너 내부 노출

  nginx:
    image: nginx
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./wordpress/data:/var/www/html:ro
    depends_on:
      - wordpress
    networks:
      - my_network
    expose:
      - "80"
      - "443"

networks:
  my_network:
    driver: bridge
